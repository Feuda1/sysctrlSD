<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sysctrlSD</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f1a;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 40px 44px;
      text-align: center;
      max-width: 420px;
    }
    .logo {
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 22px; color: #0b0f1a; letter-spacing: 1px;
      box-shadow: 0 0 28px rgba(59,130,246,.35);
    }
    h1 { margin: 0; font-size: 17px; font-weight: 600; }
    p { margin: 0; font-size: 13px; line-height: 1.5; color: #94a3b8; }
    .num { color: #60a5fa; font-weight: 600; }
    button {
      margin-top: 4px;
      border: 1px solid rgba(148,163,184,.25);
      background: rgba(148,163,184,.08);
      color: #cbd5e1;
      font-size: 13px;
      padding: 9px 18px;
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    button:hover { background: rgba(148,163,184,.16); color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">SD</div>
    <h1>Открываем заявку <span class="num" id="num"></span></h1>
    <p>Заявка открыта в приложении sysctrlSD.<br />Эту вкладку можно закрыть.</p>
    <button id="close">Закрыть вкладку</button>
  </div>
  <script src="redirect.js"></script>
</body>
</html>
