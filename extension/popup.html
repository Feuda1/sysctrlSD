<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 280px;
      background: #0b0f1a;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    .head {
      display: flex; align-items: center; gap: 10px;
      padding: 16px; border-bottom: 1px solid rgba(148,163,184,.12);
    }
    .logo {
      width: 30px; height: 30px; border-radius: 9px;
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 12px; color: #0b0f1a;
    }
    .head b { font-size: 13px; font-weight: 600; }
    .body { padding: 8px; }
    .row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 11px 10px; border-radius: 10px;
    }
    .row:hover { background: rgba(148,163,184,.06); }
    .row .label { font-size: 13px; font-weight: 500; }
    .row .hint { font-size: 11px; color: #94a3b8; margin-top: 2px; line-height: 1.35; }
    .toggle {
      position: relative; width: 40px; height: 22px; border-radius: 999px;
      background: rgba(148,163,184,.25); cursor: pointer; flex-shrink: 0;
      transition: background .18s; border: none; padding: 0;
    }
    .toggle::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 18px; height: 18px; border-radius: 50%; background: #e2e8f0;
      transition: transform .18s;
    }
    .toggle.on { background: #3b82f6; }
    .toggle.on::after { transform: translateX(18px); }
    .toggle.disabled { opacity: .4; cursor: default; }
    .divider { height: 1px; background: rgba(148,163,184,.1); margin: 4px 10px; }
    .foot { padding: 10px 16px 14px; font-size: 11px; color: #64748b; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="head">
    <div class="logo">SD</div>
    <b>sysctrlSD</b>
  </div>
  <div class="body">
    <div class="row">
      <div>
        <div class="label">Перенаправлять заявки</div>
        <div class="hint">Открывать ссылки на заявки в приложении</div>
      </div>
      <button class="toggle" id="enabled"></button>
    </div>
    <div class="divider"></div>
    <div class="row">
      <div>
        <div class="label">Закрывать вкладку</div>
        <div class="hint">Включайте после «Всегда открывать в приложении»</div>
      </div>
      <button class="toggle" id="closeTab"></button>
    </div>
  </div>
  <div class="foot">Вкладка закрывается только после того, как браузер начнёт открывать заявки без вопроса.</div>
  <script src="popup.js"></script>
</body>
</html>
